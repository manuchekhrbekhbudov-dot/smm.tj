# Once a day: gentle Telegram reminder to people who signed up 3–10 days ago but have not started,
# and the launch announcement on 1–3 December 2026. Each person gets each message at most once
# (the function keeps a log), so extra runs are harmless.
name: Telegram reminders

on:
  schedule:
    - cron: "41 6 * * *"   # every day 06:41 UTC (11:41 Dushanbe)
  workflow_dispatch: {}

permissions: {}

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send due reminders
        run: curl -fsS -X POST "https://lcldaingzicxbottlznq.supabase.co/functions/v1/tg-reminders"
