<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SMM.TJ — Reset Password</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:
        radial-gradient(circle at 50% 35%,rgba(125,45,255,.16),transparent 35%),
        #07070b;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

/* glow */
body::before{
    content:"";
    position:fixed;
    width:500px;
    height:500px;
    background:#762cff;
    filter:blur(180px);
    opacity:.12;
    top:10%;
    left:50%;
    transform:translateX(-50%);
    pointer-events:none;
}

/* card */

.card{
    width:min(440px,92%);
    padding:38px;
    border:1px solid rgba(150,80,255,.35);
    border-radius:26px;
    background:rgba(16,15,23,.88);
    box-shadow:
        0 0 50px rgba(110,35,255,.12),
        inset 0 0 40px rgba(130,60,255,.025);
    position:relative;
    z-index:2;
}

/* logo */

.logo{
    text-align:center;
    font-size:34px;
    font-weight:900;
    margin-bottom:32px;
    letter-spacing:-1px;
}

.logo span{
    color:#a855f7;
    text-shadow:0 0 18px rgba(168,85,247,.55);
}

/* icon */

.icon{
    width:72px;
    height:72px;
    margin:0 auto 22px;
    border-radius:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
    background:linear-gradient(
        135deg,
        #7028dc,
        #a855f7
    );
    box-shadow:
        0 0 30px rgba(139,55,255,.4);
}

/* text */

h1{
    text-align:center;
    margin:0 0 12px;
    font-size:28px;
}

.description{
    text-align:center;
    color:#888;
    line-height:1.55;
    margin-bottom:30px;
}

/* inputs */

label{
    display:block;
    margin:18px 0 8px;
    color:#bbb;
    font-size:14px;
}

.input-box{
    position:relative;
}

input{
    width:100%;
    height:54px;
    border-radius:13px;
    border:1px solid #343340;
    outline:none;
    background:#0b0b11;
    color:white;
    padding:0 16px;
    font-size:16px;
    transition:.2s;
}

input:focus{
    border-color:#9b4dff;
    box-shadow:0 0 0 3px rgba(155,77,255,.1);
}

/* button */

button{
    width:100%;
    height:55px;
    margin-top:25px;
    border:0;
    border-radius:14px;
    color:white;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
    background:linear-gradient(
        90deg,
        #7028dc,
        #a855f7
    );
    box-shadow:
        0 8px 30px rgba(126,40,220,.28);
    transition:.2s;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:
        0 12px 35px rgba(126,40,220,.4);
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
    transform:none;
}

/* messages */

.message{
    text-align:center;
    margin-top:18px;
    font-size:14px;
    min-height:20px;
}

.success{
    color:#61e294;
}

.error{
    color:#ff6875;
}

/* back */

.back{
    display:block;
    text-align:center;
    color:#888;
    text-decoration:none;
    margin-top:24px;
    font-size:14px;
}

.back:hover{
    color:#b06cff;
}

/* mobile */

@media(max-width:500px){

    .card{
        padding:28px 22px;
        border-radius:22px;
    }

    .logo{
        font-size:30px;
    }

    h1{
        font-size:24px;
    }

}
</style>
</head>

<body>

<div class="card">

    <div class="logo">
        SMM<span>.TJ</span>
    </div>

    <div class="icon">
        🔐
    </div>

    <h1>Паролро нав кунед</h1>

    <div class="description">
        Барои аккаунти SMM.TJ пароли нави худро ворид кунед.
    </div>

    <form id="resetForm">

        <label for="password">
            Пароли нав
        </label>

        <input
            id="password"
            type="password"
            placeholder="Пароли навро ворид кунед"
            minlength="6"
            required
        >

        <label for="confirmPassword">
            Такрори парол
        </label>

        <input
            id="confirmPassword"
            type="password"
            placeholder="Паролро такрор кунед"
            minlength="6"
            required
        >

        <button id="resetButton" type="submit">
            Тағйир додани парол
        </button>

        <div id="message" class="message"></div>

    </form>

    <a href="admin.html" class="back">
        ← Ба Admin Panel баргаштан
    </a>

</div>


<script>

const SUPABASE_URL =
"https://lcldaingzicxbottlznq.supabase.co";

const SUPABASE_KEY =
"sb_publishable_9iejRbnX7_oQ1BR5T3ZoUQ_zYez8cIt";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


const form =
document.getElementById("resetForm");

const message =
document.getElementById("message");

const button =
document.getElementById("resetButton");


form.addEventListener(
"submit",
async function(e){

    e.preventDefault();

    message.className="message";
    message.textContent="";

    const password =
    document.getElementById("password").value;

    const confirmPassword =
    document
    .getElementById("confirmPassword")
    .value;


    if(password.length < 6){

        message.className=
        "message error";

        message.textContent=
        "Парол бояд камаш 6 аломат бошад.";

        return;
    }


    if(password !== confirmPassword){

        message.className=
        "message error";

        message.textContent=
        "Паролҳо мувофиқат намекунанд.";

        return;
    }


    button.disabled=true;

    button.textContent=
    "Захира шуда истодааст...";


    const {error} =
    await supabaseClient
    .auth
    .updateUser({
        password:password
    });


    if(error){

        console.error(error);

        message.className=
        "message error";

        message.textContent=
        error.message;

        button.disabled=false;

        button.textContent=
        "Тағйир додани парол";

        return;
    }


    message.className=
    "message success";

    message.textContent=
    "Парол бомуваффақият иваз шуд! ✅";


    setTimeout(()=>{

        window.location.href=
        "admin.html";

    },1500);

});

</script>

</body>
</html>
