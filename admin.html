<!DOCTYPE html>
<html lang="tg">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SMM.TJ — Admin Panel</title>

  <link rel="stylesheet" href="index.css">

  <style>

    .admin-page {
      min-height: 100vh;
      background: #050507;
    }

    .admin-header {
      height: 72px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 5%;

      border-bottom: 1px solid rgba(255,255,255,.09);

      background: rgba(8,8,12,.9);

      backdrop-filter: blur(15px);
    }

    .admin-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .admin-title strong {
      font-size: 21px;
    }

    .admin-badge {
      padding: 6px 10px;

      border-radius: 999px;

      font-size: 11px;

      color: #d8b4fe;

      background: rgba(124,58,237,.15);
    }

    .admin-layout {
      display: grid;

      grid-template-columns: 240px 1fr;

      min-height: calc(100vh - 72px);
    }

    .admin-sidebar {
      border-right: 1px solid rgba(255,255,255,.08);

      padding: 25px 15px;

      background: #08080c;
    }

    .admin-nav {
      display: grid;
      gap: 5px;
    }

    .admin-nav button {
      width: 100%;

      text-align: left;

      padding: 13px;

      color: #a1a1aa;

      background: transparent;

      border-radius: 10px;

      transition: .2s;
    }

    .admin-nav button:hover,
    .admin-nav button.active {
      color: white;

      background:
        rgba(124,58,237,.15);
    }

    .admin-main {
      padding: 35px;

      overflow-x: auto;
    }

    .admin-main h1 {
      margin-bottom: 30px;

      font-size: 34px;
    }

    .admin-stats {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 15px;

      margin-bottom: 30px;
    }

    .admin-stat {
      padding: 22px;

      border: 1px solid rgba(255,255,255,.08);

      border-radius: 18px;

      background: #111117;
    }

    .admin-stat small {
      color: #71717a;
    }

    .admin-stat strong {
      display: block;

      margin-top: 8px;

      font-size: 28px;
    }

    .admin-table-box {
      padding: 20px;

      border: 1px solid rgba(255,255,255,.08);

      border-radius: 18px;

      background: #111117;
    }

    .admin-table-header {
      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 15px;

      margin-bottom: 20px;
    }

    .admin-table-header input {
      padding: 11px 13px;

      color: white;

      background: #17171f;

      border: 1px solid rgba(255,255,255,.08);

      border-radius: 9px;

      outline: none;
    }

    .admin-table {
      width: 100%;

      border-collapse: collapse;

      min-width: 700px;
    }

    .admin-table th,
    .admin-table td {
      text-align: left;

      padding: 14px;

      border-bottom:
        1px solid rgba(255,255,255,.07);
    }

    .admin-table th {
      color: #71717a;

      font-size: 12px;
    }

    .admin-table td {
      color: #d4d4d8;

      font-size: 14px;
    }

    .admin-status {
      display: inline-block;

      padding: 5px 8px;

      border-radius: 7px;

      font-size: 11px;

      background:
        rgba(124,58,237,.13);

      color: #d8b4fe;
    }

    .admin-action {
      padding: 7px 10px;

      border-radius: 8px;

      color: white;

      background: rgba(255,255,255,.06);

      margin-right: 5px;
    }

    .admin-action:hover {
      background: rgba(124,58,237,.2);
    }

    @media(max-width:900px) {

      .admin-layout {
        grid-template-columns: 1fr;
      }

      .admin-sidebar {
        border-right: 0;

        border-bottom:
          1px solid rgba(255,255,255,.08);

        overflow-x: auto;
      }

      .admin-nav {
        display: flex;

        min-width: max-content;
      }

      .admin-nav button {
        width: auto;
      }

      .admin-stats {
        grid-template-columns:
          repeat(2,1fr);
      }

    }

    @media(max-width:600px) {

      .admin-main {
        padding: 20px;
      }

      .admin-stats {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>


<body>

<div class="admin-page">

  <header class="admin-header">

    <div class="admin-title">

      <div class="logo">
        SMM<span>.TJ</span>
      </div>

      <span class="admin-badge">
        ADMIN
      </span>

    </div>

    <button
      class="btn btn-outline"
      id="adminLogout"
    >
      Баромадан
    </button>

  </header>


  <div class="admin-layout">

    <aside class="admin-sidebar">

      <nav class="admin-nav">

        <button class="active" data-admin-page="dashboard">
          📊 Dashboard
        </button>

        <button data-admin-page="users">
          👥 Users
        </button>

        <button data-admin-page="projects">
          📁 Projects
        </button>

        <button data-admin-page="services">
          ⚙ Services
        </button>

        <button data-admin-page="reviews">
          ⭐ Reviews
        </button>

        <button data-admin-page="payments">
          💳 Payments
        </button>

        <button data-admin-page="settings">
          ⚙ Settings
        </button>

      </nav>

    </aside>


    <main class="admin-main">

      <h1 id="adminPageTitle">
        Dashboard
      </h1>


      <section class="admin-stats">

        <div class="admin-stat">
          <small>Total Users</small>
          <strong id="totalUsers">—</strong>
        </div>

        <div class="admin-stat">
          <small>Clients</small>
          <strong id="totalClients">—</strong>
        </div>

        <div class="admin-stat">
          <small>Specialists</small>
          <strong id="totalSpecialists">—</strong>
        </div>

        <div class="admin-stat">
          <small>Active Projects</small>
          <strong id="activeProjects">—</strong>
        </div>

      </section>


      <section class="admin-table-box">

        <div class="admin-table-header">

          <h2 id="tableTitle">
            Users
          </h2>

          <input
            type="search"
            id="adminSearch"
            placeholder="Ҷустуҷӯ..."
          >

        </div>


        <div style="overflow-x:auto">

          <table class="admin-table">

            <thead>

              <tr>

                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Status</th>
                <th>Actions</th>

              </tr>

            </thead>

            <tbody id="adminTableBody">

              <tr>

                <td colspan="6">
                  Loading...
                </td>

              </tr>

            </tbody>

          </table>

        </div>

      </section>

    </main>

  </div>

</div>


<script src="Script.js"></script>

<script>

  /*
   * Admin panel intentionally does NOT invent users/projects.
   * Script.js requests them from the real backend.
   */

  document
    .querySelectorAll("[data-admin-page]")
    .forEach(button => {

      button.addEventListener("click", () => {

        document
          .querySelectorAll("[data-admin-page]")
          .forEach(item =>
            item.classList.remove("active")
          );

        button.classList.add("active");

        const page =
          button.dataset.adminPage;

        document
          .getElementById("adminPageTitle")
          .textContent = page;

        document
          .getElementById("tableTitle")
          .textContent = page;

        if (
          window.SMMTJ &&
          typeof window.SMMTJ.loadAdminPage === "function"
        ) {
          window.SMMTJ.loadAdminPage(page);
        }

      });

    });

</script>

</body>
</html>
